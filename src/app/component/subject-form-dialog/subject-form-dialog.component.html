<h2 mat-dialog-title>{{ isEdit ? 'Modifier la matière' : 'Nouvelle matière' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" maxlength="50" autocomplete="off" />
      <mat-error>Code requis.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" maxlength="200" autocomplete="off" />
      <mat-error>Nom requis.</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Annuler</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="submit()"
    [disabled]="saving || form.invalid"
  >
    {{ saving ? 'Enregistrement…' : isEdit ? 'Enregistrer' : 'Ajouter' }}
  </button>
</mat-dialog-actions>
