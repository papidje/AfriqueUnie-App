<div class="class-workspace">
  <div class="top-bar">
    <button
      mat-icon-button
      type="button"
      routerLink="/classes"
      matTooltip="Retour aux classes"
      aria-label="Retour aux classes"
      class="exit-btn"
    >
      <mat-icon>close</mat-icon>
    </button>
    <div class="title-block">
      <h1>{{ heading || '…' }}</h1>
    </div>
    <span class="top-spacer"></span>
  </div>

  <app-class-workspace-context-bar [workspaceSegment]="workspaceSegment"></app-class-workspace-context-bar>

  <div class="class-tabs" role="navigation" aria-label="Sections classe">
    <button
      type="button"
      mat-stroked-button
      routerLink="matieres"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Matières
    </button>
    <button
      type="button"
      mat-stroked-button
      routerLink="periodes"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Périodes
    </button>
  </div>
  <div class="tab-panel">
    <router-outlet></router-outlet>
  </div>
</div>
