<div class="auth-container">
  <div class="auth-card">
    <app-karanso-brand variant="auth"></app-karanso-brand>
    <h2 class="title">Réinitialiser le mot de passe</h2>
    <p class="subtitle">
      Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.
      Valable aussi si votre code d’activation a expiré : le nouveau code active le compte.
    </p>

    <p *ngIf="successMessage" class="auth-success" role="status">
      {{ successMessage }}
      <a routerLink="/newPwd">J’ai déjà le code</a>
    </p>
    <p *ngIf="submitError" class="auth-error" role="alert">
      {{ submitError }}
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-form">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="exemple@domaine.com"
          required
          (input)="submitError = null; successMessage = null"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Envoi…' : 'Envoyer le lien' }}
      </button>

      <div class="back-login">
        <a routerLink="/login">← Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
