<h2 mat-dialog-title>Nouvel établissement</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="school-form">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.controls.name.hasError('required')">Requis</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="adress" />
      <mat-error *ngIf="form.controls.adress.hasError('required')">Requis</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contact</mat-label>
      <input matInput formControlName="contact" />
      <mat-error *ngIf="form.controls.contact.hasError('required')">Requis</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date d’ouverture</mat-label>
      <input matInput type="date" formControlName="openDate" />
      <mat-error *ngIf="form.controls.openDate.hasError('required')">Requis</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Annuler</button>
  <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="saving || form.invalid">
    {{ saving ? 'Création…' : 'Créer' }}
  </button>
</mat-dialog-actions>
