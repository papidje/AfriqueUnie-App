<h2 mat-dialog-title>Nouvelle évaluation</h2>

<div mat-dialog-content *ngIf="loading" class="loading">Chargement…</div>

<form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="form">
  <mat-form-field appearance="outline" class="full">
    <mat-label>Période de notation</mat-label>
    <mat-select formControlName="gradingPeriodId" required>
      <mat-option *ngFor="let p of periods" [value]="p.id">{{ p.name }}</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('gradingPeriodId')?.hasError('required')">Requis</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Matière</mat-label>
    <mat-select formControlName="classSubjectId" required>
      <mat-option *ngFor="let s of subjects" [value]="s.id">
        {{ s.subjectCode }} — {{ s.subjectName }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('classSubjectId')?.hasError('required')">Requis</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Titre</mat-label>
    <input matInput formControlName="title" required autocomplete="off" />
    <mat-error *ngIf="form.get('title')?.hasError('required')">Requis</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Type</mat-label>
    <mat-select formControlName="type" required>
      <mat-option *ngFor="let t of typeOptions" [value]="t.value">{{ t.label }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="third">
    <mat-label>Date</mat-label>
    <input matInput type="date" formControlName="examDate" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="third">
    <mat-label>Début</mat-label>
    <input matInput type="time" formControlName="startTime" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="third">
    <mat-label>Fin</mat-label>
    <input matInput type="time" formControlName="endTime" required />
  </mat-form-field>
  <p class="form-row-error" *ngIf="form.touched && form.hasError('endBeforeStart')">
    L’heure de fin doit être après l’heure de début.
  </p>

  <mat-form-field appearance="outline" class="half">
    <mat-label>Coefficient</mat-label>
    <input matInput type="number" formControlName="coefficient" min="0.01" step="0.1" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="half">
    <mat-label>Note max.</mat-label>
    <input matInput type="number" formControlName="maxScore" min="0.01" step="0.5" required />
    <mat-hint>Barème (souvent 20)</mat-hint>
  </mat-form-field>
</form>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Annuler</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="submit()"
    [disabled]="loading || saving || !periods.length || !subjects.length"
  >
    Créer
  </button>
</div>
