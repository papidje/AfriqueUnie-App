<mat-card *ngIf="user" class="profile-card">
  <mat-card-header>
    <mat-card-title>Profil utilisateur</mat-card-title>
    <mat-card-subtitle>Détails du compte</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="profile-item"><strong>ID :</strong> {{ user.id }}</div>
    <div class="profile-item"><strong>Nom complet :</strong> {{ user.fullname }}</div>
    <div class="profile-item"><strong>Nom d'utilisateur :</strong> {{ user.username }}</div>
    <div class="profile-item"><strong>Email :</strong> {{ user.email }}</div>
    <div class="profile-item">
      <strong>Statut :</strong>
      <span [ngClass]="user.isActive ? 'active' : 'inactive'">
        {{ user.isActive ? 'Actif' : 'Inactif' }}
      </span>
    </div>
    <div class="profile-item">
      <strong>Rôles :</strong>
      <span *ngIf="user.roles?.length; else noRoles">
        {{ user.roles.join(', ') }}
      </span>
      <ng-template #noRoles>Aucun rôle attribué</ng-template>
    </div>
  </mat-card-content>
</mat-card>

<mat-progress-spinner *ngIf="!user" diameter="50" style="margin: 40px auto; display: block;"></mat-progress-spinner>
