<section class="class-hub-shell-page">
  <div class="page-head">
    <div class="page-head__text">
      <h1>{{ hubTitle }}</h1>
      <p class="intro">{{ hubSubtitle }}</p>
    </div>
    <button
      *ngIf="headerAction$ | async as action"
      mat-raised-button
      color="primary"
      type="button"
      class="hub-action-btn"
      [disabled]="!!action.disabled"
      (click)="action.run()"
    >
      <mat-icon *ngIf="action.icon">{{ action.icon }}</mat-icon>
      {{ action.label }}
    </button>
  </div>

  <mat-card class="list-card">
    <div class="loading" *ngIf="loadingClasses">Chargement des classes…</div>

    <div *ngIf="!loadingClasses && sortedClasses.length" class="class-tabs">
      <button
        type="button"
        mat-stroked-button
        *ngFor="let cl of sortedClasses"
        [class.active]="isTabActive(cl)"
        (click)="onClassTabClick(cl)"
      >
        {{ cl.name }}
      </button>
    </div>

    <div class="tab-content" *ngIf="selectionReady">
      <router-outlet></router-outlet>
    </div>

    <div class="empty" *ngIf="!loadingClasses && sortedClasses.length === 0">
      Aucune classe trouvée pour l’année active.
    </div>
  </mat-card>
</section>
