<div class="auth-container">
  <div class="auth-card">
    <app-karanso-brand variant="auth"></app-karanso-brand>
    <h2 class="title">Définir un nouveau mot de passe</h2>
    <p class="subtitle">
      Entrez votre e-mail, le code reçu et votre nouveau mot de passe pour réinitialiser votre compte.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="exemple@domaine.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="code">Code de vérification</label>
        <input
          id="code"
          type="text"
          formControlName="code"
          placeholder="Code reçu par e-mail"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Au moins 6 caractères"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirmez le mot de passe"
          required
        />
      </div>

      <p *ngIf="form.hasError('passwordMismatch') && form.touched" class="auth-error" role="alert">
        Les deux mots de passe ne correspondent pas.
      </p>
      <p *ngIf="submitError" class="auth-error" role="alert">
        {{ submitError }}
      </p>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Mise à jour…' : 'Mettre à jour le mot de passe' }}
      </button>

      <div class="back-login">
        <a routerLink="/login">← Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
