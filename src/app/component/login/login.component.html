<div class="auth-container">
  <div class="auth-card">
    <h2 class="title">Connexion</h2>
    <p *ngIf="activationSuccessMessage" style="color:#2e7d32; margin-bottom: 12px;">
      {{ activationSuccessMessage }}
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="userName">Email</label>
        <input
          id="userName"
          type="email"
          formControlName="userName"
          placeholder="Entrez votre adresse e-mail"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
          required
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        Se connecter
      </button>

      <div class="links">
        <a routerLink="/register-school">Inscrire une école</a>
        <span>/</span>
        <a routerLink="/activate">Activer un compte</a>
      </div>

      <div class="reset">
        <span>Mot de passe oublié ?</span>
        <a routerLink="/resetPwd">Réinitialiser</a>
      </div>
    </form>
  </div>
</div>
