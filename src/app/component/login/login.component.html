<div class="auth-container">
  <div class="auth-card">
    <h2 class="title">Connexion</h2>
    <p class="subtitle">Accédez à votre espace de gestion scolaire.</p>
    <p *ngIf="activationSuccessMessage" class="auth-success" role="status">
      {{ activationSuccessMessage }}
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="userName">Email</label>
        <input
          id="userName"
          type="email"
          formControlName="userName"
          placeholder="Entrez votre adresse e-mail"
          required
          (input)="loginErrorMessage = null"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
          required
          (input)="loginErrorMessage = null"
          [attr.aria-invalid]="loginErrorMessage ? 'true' : 'false'"
          [attr.aria-describedby]="loginErrorMessage ? 'login-password-error' : null"
        />
        <p
          *ngIf="loginErrorMessage"
          id="login-password-error"
          class="login-password-error"
          role="alert"
        >
          {{ loginErrorMessage }}
        </p>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        Se connecter
      </button>

      <div class="links">
        <a routerLink="/register-school">Inscrire une école</a>
        <span>/</span>
        <a routerLink="/activate">Activer un compte</a>
      </div>

      <div class="reset">
        <span>Mot de passe oublié ?</span>
        <a routerLink="/resetPwd">Réinitialiser</a>
      </div>
    </form>
  </div>
</div>
