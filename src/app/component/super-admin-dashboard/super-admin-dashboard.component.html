<div class="page">
  <header class="page-head">
    <h1>Liste des tenants</h1>
  </header>

  <div *ngIf="loading" class="state">Chargement…</div>
  <p *ngIf="error && !loading" class="state error">Impossible de charger les données.</p>

  <div class="table-wrap" *ngIf="!loading && !error && rows.length">
    <table mat-table [dataSource]="rows" class="tenants-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Tenant</th>
        <td mat-cell *matCellDef="let row">
          <span class="tenant-name">{{ row.name }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Adresse</th>
        <td mat-cell *matCellDef="let row" class="muted">{{ row.address || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Créé le</th>
        <td mat-cell *matCellDef="let row">{{ row.createdAt | displayDate:'datetime' }}</td>
      </ng-container>

      <ng-container matColumnDef="schools">
        <th mat-header-cell *matHeaderCellDef>Écoles</th>
        <td mat-cell *matCellDef="let row">
          <button
            type="button"
            class="count-btn"
            (click)="openSchools(row)"
            [disabled]="schoolCount(row) === 0"
            [attr.aria-label]="'Voir les écoles du tenant ' + row.name"
          >
            {{ schoolCount(row) }}
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Actives</th>
        <td mat-cell *matCellDef="let row">
          <span class="muted">{{ activeSchoolCount(row) }} / {{ schoolCount(row) }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <p *ngIf="!loading && !error && !rows.length" class="empty">Aucun tenant enregistré.</p>
</div>
