<ng-container *ngIf="vm$ | async as vm">
  <!-- Bandeau uniquement si aucune année active : libère la hauteur quand le contexte est prêt -->
  <div class="academic-banner academic-banner--cta" *ngIf="vm.visible && !vm.year" role="status">
    <mat-icon class="banner-icon" aria-hidden="true">event_busy</mat-icon>
    <span class="banner-text">
      <span class="banner-label">Année scolaire</span>
      <span class="banner-sep">·</span>
      <span class="banner-warn">Aucune année active.</span>
      <button
        mat-stroked-button
        type="button"
        color="primary"
        class="banner-action"
        [routerLink]="['/annee-scolaire/nouvelle']"
        [queryParams]="{ schoolId: vm.schoolId, returnUrl: router.url }"
      >
        Créer une année scolaire
      </button>
    </span>
  </div>
</ng-container>
