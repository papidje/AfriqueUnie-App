<div class="page">
  <div class="page-head">
    <div>
      <h1>Référentiel des matières</h1>
      <p class="subtitle">Matières globales partagées par tous les établissements (school_id null).</p>
    </div>
    <button mat-raised-button color="primary" type="button" (click)="startCreate()">
      <mat-icon>add</mat-icon>
      Nouvelle matière
    </button>
  </div>

  <mat-card class="form-card">
    <mat-card-title>{{ editingId != null ? 'Modifier la matière' : 'Ajouter une matière' }}</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form" class="grid-form" (ngSubmit)="save()">
        <mat-form-field appearance="outline">
          <mat-label>Code</mat-label>
          <input matInput formControlName="code" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>
        <div class="actions">
          <button mat-button type="button" (click)="cancelEdit()" [disabled]="saving">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="saving || form.invalid">
            {{ saving ? 'Enregistrement…' : editingId != null ? 'Mettre à jour' : 'Ajouter' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div *ngIf="loading" class="state">Chargement…</div>

  <div class="table-wrap" *ngIf="!loading">
    <table class="tbl">
      <thead>
        <tr>
          <th>Code</th>
          <th>Nom</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of subjects">
          <td>{{ s.code }}</td>
          <td>{{ s.name }}</td>
          <td class="actions">
            <button mat-icon-button type="button" (click)="startEdit(s)" aria-label="Modifier">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button type="button" (click)="delete(s)" aria-label="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!subjects.length" class="empty">Aucune matière globale.</p>
  </div>
</div>
