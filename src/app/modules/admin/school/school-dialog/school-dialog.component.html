<h2 mat-dialog-title>{{ isEdit ? 'Modifier une école' : 'Créer une école' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="school-form">
    <mat-form-field appearance="outline">
      <mat-label>Nom de l'école</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="adress">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contact</mat-label>
      <input matInput formControlName="contact">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date d'ouverture</mat-label>
      <input matInput type="date" formControlName="openDate" [min]="openDateMin" [max]="openDateMax">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ville</mat-label>
      <mat-select formControlName="cityId">
        <mat-option *ngFor="let c of cities" [value]="c.id">
          {{ c.name }}<span *ngIf="c.region?.name"> ({{ c.region?.name }})</span>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    {{ isEdit ? 'Mettre à jour' : 'Créer' }}
  </button>
</mat-dialog-actions>
