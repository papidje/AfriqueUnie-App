<div class="school-container">

  <div class="header">
    <h2>Liste des écoles</h2>
    <button mat-raised-button color="primary" (click)="openDialog()">+ Nouvelle école</button>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <div *ngIf="!loading && dataSource.data.length === 0" class="empty">
    <p>Aucune école enregistrée</p>
  </div>

  <div *ngIf="!loading && dataSource.data.length > 0" class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let school">{{ school.id }}</td>
      </ng-container>

      <ng-container matColumnDef="logo">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let school">
          <img *ngIf="logoDisplayUrl(school.logo) as logoUrl" [src]="logoUrl" alt="logo" class="logo" />
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let school">{{ school.name }}</td>
      </ng-container>

      <ng-container matColumnDef="adress">
        <th mat-header-cell *matHeaderCellDef>Adresse</th>
        <td mat-cell *matCellDef="let school">{{ school.adress }}</td>
      </ng-container>

      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let school">{{ school.contact }}</td>
      </ng-container>

      <ng-container matColumnDef="openDate">
        <th mat-header-cell *matHeaderCellDef>Ouverture</th>
        <td mat-cell *matCellDef="let school">{{ school.openDate | date }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let school" class="actions">
          <button mat-icon-button color="primary" (click)="viewDetails(school)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="openDialog(school)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="toggleActivation(school)">
            <mat-icon>{{ school.active ? 'domain' : 'domain_disabled' }}</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSchool(school)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</div>
