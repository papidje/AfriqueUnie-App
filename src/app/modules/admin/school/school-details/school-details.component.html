<h2>{{ school?.name }}</h2>
<p>Adresse: {{ school?.adress }}</p>
<p>Contact: {{ school?.contact }}</p>
<p>Ouverture: {{ school?.openDate | date }}</p>
<img *ngIf="school?.logo" [src]="school?.logo" alt="Logo" width="120">

<h3>Administrateurs</h3>
<button mat-raised-button color="primary" (click)="openAssignDialog()">Ajouter un admin</button>

<table mat-table [dataSource]="admins" class="mat-elevation-z8">
  <ng-container matColumnDef="fullname">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let admin">{{ admin.fullname }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let admin">{{ admin.email }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let admin">
      <button mat-button color="warn" (click)="removeAdmin(admin.id)">Supprimer</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['fullname','email','actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['fullname','email','actions']"></tr>
</table>
