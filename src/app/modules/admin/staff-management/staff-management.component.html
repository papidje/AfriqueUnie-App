<section class="staff-page">
  <mat-card>
    <h2>Gestion du Staff</h2>
    <p>Ajoutez des membres STAFF rattaches a votre ecole.</p>

    <form [formGroup]="staffForm" (ngSubmit)="createStaff()" class="staff-form">
      <mat-form-field appearance="outline">
        <mat-label>Nom complet</mat-label>
        <input matInput formControlName="fullname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nom utilisateur</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">Ajouter STAFF</button>
    </form>
  </mat-card>

  <mat-card>
    <h3>Utilisateurs STAFF de votre ecole</h3>
    <div *ngIf="loading">Chargement...</div>
    <table mat-table [dataSource]="staffUsers" *ngIf="!loading">
      <ng-container matColumnDef="fullname">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let user">{{ user.fullname }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['fullname', 'email', 'username']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['fullname', 'email', 'username'];"></tr>
    </table>
  </mat-card>
</section>
