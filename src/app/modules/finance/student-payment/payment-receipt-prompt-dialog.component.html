<h2 mat-dialog-title>Paiement enregistré</h2>

<mat-dialog-content class="dlg-body">
  <p>Le paiement a bien été enregistré.</p>
  <p class="meta">
    <strong>{{ data.studentName }}</strong><br />
    Réf. <code>{{ data.reference }}</code> ·
    <strong>{{ asMoney(data.totalCollected) }} GNF</strong>
  </p>
  <p class="hint">Souhaitez-vous imprimer le reçu ?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Fermer</button>
  <button mat-flat-button color="primary" type="button" (click)="printReceipt(); close()">
    Imprimer le reçu
  </button>
</mat-dialog-actions>
